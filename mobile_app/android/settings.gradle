pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        File localPropertiesFile = new File(settingsDir, "local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }
        }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        if (flutterSdkPath == null || flutterSdkPath.isEmpty()) {
            flutterSdkPath = System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME") ?: System.getenv("FLUTTER_SDK")
        }
        if (flutterSdkPath == null || flutterSdkPath.isEmpty()) {
            try {
                def proc = "which flutter".execute()
                proc.waitFor()
                def flutterBin = proc.text.trim()
                if (flutterBin) {
                    flutterSdkPath = new File(flutterBin).parentFile.parentFile.absolutePath
                }
            } catch (Exception ignored) {}
        }
        assert flutterSdkPath != null && !flutterSdkPath.isEmpty() : "flutter.sdk not set in local.properties, FLUTTER_ROOT/FLUTTER_HOME environment variable, or PATH"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
}

include ":app"
